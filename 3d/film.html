<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HardPix</title>
  <meta name="description" content="A 64-second real-time 3D film of the HardPix radiation spectrometer, ending on real measured particle tracks." />
  <link rel="icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0c;
      --text: #f0ece6;
      --muted: #888;
      --dim: #555;
      --copper: #b8703a;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* ---------- captions ---------- */
    /* a soft floor scrim so captions stay legible over a bright exploded stack */
    #scrim {
      position: absolute; left: 0; right: 0; bottom: 0; height: 42vh; pointer-events: none;
      background: linear-gradient(to top, rgba(12,12,12,.82) 0%, rgba(12,12,12,.45) 42%, rgba(12,12,12,0) 100%);
    }
    #captions {
      position: absolute; left: 0; right: 0; bottom: 9vh;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      pointer-events: none; padding: 0 8vw; text-align: center;
    }
    #captions.top { bottom: auto; top: 5vh; }
    #captions.top ~ #scrim, #scrim { transition: opacity .6s ease; }
    #cap-main {
      font-family: var(--serif); font-weight: 300; font-size: clamp(22px, 3.4vw, 44px);
      line-height: 1.25; letter-spacing: 0.01em;
      opacity: 0; transform: translateY(28px); transition: opacity .9s ease, transform .9s ease;
      text-shadow: 0 2px 30px rgba(0,0,0,.75);
    }
    #cap-sub {
      font-size: clamp(9px, 1vw, 11px); font-weight: 400; text-transform: uppercase;
      letter-spacing: 0.22em; color: var(--muted); max-width: 62ch; line-height: 1.9;
      opacity: 0; transform: translateY(20px); transition: opacity .9s ease .12s, transform .9s ease .12s;
      text-shadow: 0 2px 20px rgba(0,0,0,.8);
    }
    #cap-main.in, #cap-sub.in { opacity: 1; transform: translateY(0); }

    /* ---------- leader labels ---------- */
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .label {
      position: absolute; top: 0; left: 0; display: flex; align-items: center; gap: 8px;
      opacity: 0; transition: opacity .55s ease; white-space: nowrap;
    }
    #labels.on .label.in { opacity: 1; }
    .label .rule { width: 26px; height: 1px; background: var(--copper); flex: none; }
    .label .stack { display: flex; flex-direction: column; gap: 3px; }
    .label .txt {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text);
      text-shadow: 0 1px 2px #000, 0 0 16px rgba(0,0,0,.95);
    }
    .label .det {
      font-size: 9px; font-weight: 300; letter-spacing: 0.06em; color: #b9b3aa;
      text-transform: none; text-shadow: 0 1px 2px #000, 0 0 14px rgba(0,0,0,.95);
    }

    /* ---------- transport ---------- */
    #transport {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 22px clamp(18px, 4vw, 44px);
      display: flex; align-items: center; gap: 20px;
      opacity: 0; transition: opacity .4s ease;
    }
    #stage:hover #transport, #stage.ended #transport, #stage.paused #transport,
    #stage.intro #transport { opacity: 1; }

    /* big play affordance when the film is parked (reduced motion, or paused) */
    #poster-play {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: none; align-items: center; gap: 14px;
      padding: 14px 26px; border: 1px solid #262626; background: rgba(12,12,12,.55);
      backdrop-filter: blur(2px); font-size: 11px; letter-spacing: 0.24em;
    }
    #stage.paused #poster-play { display: flex; }
    #poster-play:hover { border-color: var(--copper); color: var(--text); }
    #poster-play .tri { width: 0; height: 0; border-left: 9px solid var(--copper); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    /* position:relative confines the tall hit-area below to the scrubber itself —
       without it the pseudo-element resolves against #transport and covers the
       buttons, swallowing their clicks. */
    #scrub { flex: 1; height: 22px; display: flex; align-items: center; cursor: pointer; position: relative; }
    #scrub::before { content: ''; position: absolute; inset: 0; }
    #track { width: 100%; height: 1px; background: #262626; position: relative; }
    #played { position: absolute; left: 0; top: 0; height: 1px; width: 0; background: var(--copper); }
    button {
      position: relative; z-index: 2;
      background: none; border: 0; color: var(--muted); cursor: pointer; font-family: var(--sans);
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; padding: 6px 0;
      transition: color .3s ease, letter-spacing .3s ease;
    }
    button:hover { color: var(--text); letter-spacing: 0.26em; }
    /* audio cannot start until the viewer touches the page, so while the score
       is waiting on that gesture the control says so in the accent colour */
    #sound.armed { color: var(--copper); }
    #hint {
      position: absolute; left: 50%; bottom: 4.5rem; transform: translateX(-50%);
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--dim);
      opacity: 0; transition: opacity .8s ease; pointer-events: none;
    }
    #stage.ended #hint { opacity: 1; }

    /* ---------- loader ---------- */
    #loader {
      position: fixed; inset: 0; background: var(--bg); z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      transition: opacity 1s ease;
    }
    #loader.gone { opacity: 0; pointer-events: none; }
    #loader .mark { font-family: var(--serif); font-weight: 300; font-size: clamp(28px, 4vw, 46px); letter-spacing: 0.02em; }
    #loader .status, #loader .count {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.24em; color: var(--dim);
    }
    #barwrap { width: min(300px, 60vw); height: 1px; background: #262626; }
    #bar { height: 1px; width: 0; background: var(--copper); transition: width .25s ease; }

    /* The play gate. Hidden while loading; it replaces the progress bar and the
       percentage once the model is in, so the last thing on the loading screen
       is an invitation rather than a finished meter. */
    #start {
      display: none; align-items: center; gap: 14px;
      padding: 15px 30px; border: 1px solid #2e2e2e; background: rgba(12,12,12,.55);
      color: var(--muted); font-size: 11px; letter-spacing: 0.24em;
    }
    #start .tri {
      width: 0; height: 0; border-left: 9px solid var(--copper);
      border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    }
    #start:hover, #start:focus-visible { border-color: var(--copper); color: var(--text); }
    #loader.ready #start { display: flex; }
    #loader.ready #barwrap, #loader.ready .status { display: none; }

    @media (max-width: 700px) {
      #captions { bottom: 16vh; }
      .label .txt { font-size: 9px; letter-spacing: 0.14em; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="scrim"></div>
    <div id="labels"></div>
    <div id="captions">
      <div id="cap-main"></div>
      <div id="cap-sub"></div>
    </div>
    <div id="hint">Drag to explore</div>
    <button id="poster-play"><span class="tri"></span>Play the film</button>
    <div id="transport">
      <button id="playpause">Pause</button>
      <button id="replay">Replay</button>
      <button id="sound" aria-pressed="false" title="Toggle the score">Sound off</button>
      <div id="scrub"><div id="track"><div id="played"></div></div></div>
    </div>
  </div>

  <div id="loader">
    <div class="mark">HardPix</div>
    <div id="barwrap"><div id="bar"></div></div>
    <div class="status">Loading — <span id="pct">0</span>%</div>
    <!-- Shown once the model is ready. No browser starts audio without a
         gesture, so the film is gated on this click rather than autoplaying
         mute: the viewer gets picture and score together from frame 0. -->
    <button id="start"><span class="tri"></span>Play with sound</button>
  </div>

  <script type="module" src="./assets/film.js"></script>
</body>
</html>
